    <text fill="#C9A227" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="3.2">
      <textPath href="#wmTop" xlink:href="#wmTop" startOffset="50%" text-anchor="middle">KHAOSAN</textPath>
    </text>
    <text fill="#C9A227" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="700" letter-spacing="4">
      <textPath href="#wmBot" xlink:href="#wmBot" startOffset="50%" text-anchor="middle">THAI FOOD</textPath>
    </text>
    <!-- estrella superior -->
