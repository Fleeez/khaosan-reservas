      C 65.5 56, 66.5 53.5, 66.5 51
      C 71 56, 71 63, 65.5 67
      C 69 66, 71 63, 71.5 60
      C 73.5 67, 69.5 74, 60 74
      C 50.5 74, 46.5 67, 48.5 60
      C 49 63, 51 66, 54.5 67
      C 49 63, 49 56, 53.5 51
      C 53.5 53.5, 54.5 56, 57 57
      C 53 52, 53 46, 60 38 Z"/>
    <!-- bowl -->
    <path stroke="none" d="M42 78 H78 A18 18 0 0 1 42 78 Z"/>
    <rect x="42" y="76" width="36" height="2.2" rx="1.1" stroke="none"/>
    <!-- palillos cruzados -->
    <line x1="82" y1="62" x2="70" y2="88" stroke-width="2.4" stroke-linecap="round"/>
    <line x1="90" y1="66" x2="74" y2="90" stroke-width="2.4" stroke-linecap="round"/>
